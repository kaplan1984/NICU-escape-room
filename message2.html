<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incoming Transmission</title>

  <style>
    body {
      margin: 0;
      background: #05080b;
      color: #d9f3ff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      width: 92%;
      max-width: 850px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      letter-spacing: 4px;
      color: #9eeaff;
      margin-bottom: 8px;
    }

    .status {
      font-size: 13px;
      letter-spacing: 2px;
      color: #ff4d4d;
      margin-bottom: 25px;
    }

    video {
      width: 100%;
      max-height: 75vh;
      background: black;
      border: 1px solid #284752;
      box-shadow: 0 0 25px rgba(80, 210, 255, 0.15);
    }

    .warning {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #718891;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <h1>INCOMING TRANSMISSION</h1>

    <div class="status">
      CONNECTION UNSTABLE
    </div>

    <video controls playsinline>
      <source src="sagee.mp4" type="video/mp4">
      הדפדפן אינו תומך בהפעלת הסרטון.
    </video>

    <div class="warning">
      UNAUTHORIZED ACCESS DETECTED
    </div>

  </div>

</body>
</html>
