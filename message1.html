<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incoming Transmission</title>

  <style>
    body {
      margin: 0;
      background: #05080b;
      color: #d9f3ff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      width: 92%;
      max-width: 850px;
      text-align: center;
    }

    .status {
      font-family: monospace;
      letter-spacing: 3px;
      font-size: 14px;
      color: #7dd3fc;
      margin-bottom: 10px;
    }

    h1 {
      font-family: monospace;
      letter-spacing: 4px;
      font-size: 30px;
      margin: 0 0 8px;
    }

    .source {
      font-family: monospace;
      color: #ff6b6b;
      margin-bottom: 28px;
    }

    .screen {
      background: #000;
      border: 1px solid #294554;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 0 35px rgba(35, 148, 190, 0.18);
    }

    video {
      width: 100%;
      max-height: 65vh;
      background: black;
      border-radius: 8px;
      display: none;
    }

    button {
      margin: 35px auto 20px;
      padding: 16px 30px;
      border: 1px solid #7dd3fc;
      border-radius: 8px;
      background: transparent;
      color: #d9f3ff;
      font-size: 17px;
      font-family: monospace;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(125, 211, 252, 0.08);
    }

    #warning {
      margin-top: 20px;
      font-family: monospace;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="status">SECURE CHANNEL ESTABLISHED</div>

    <h1>INCOMING TRANSMISSION</h1>

    <div class="source">SOURCE: UNKNOWN</div>

    <div class="screen">

      <button id="playButton" onclick="playMessage()">
        ▶ PLAY MESSAGE
      </button>

      <video id="video" controls playsinline>
        <source src="message1.mp4" type="video/mp4">
        הדפדפן שלך לא תומך בהפעלת וידאו.
      </video>

    </div>

    <div id="warning">
      UNAUTHORIZED ACCESS DETECTED
    </div>

  </div>

  <script>
    function playMessage() {
      const video = document.getElementById("video");
      const button = document.getElementById("playButton");

      button.style.display = "none";
      video.style.display = "block";

      video.play();
    }
  </script>

</body>
</html>
