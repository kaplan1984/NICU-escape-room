<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Incoming Transmission</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #05080b;
      color: #d9f3ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      width: 92%;
      max-width: 850px;
      text-align: center;
    }

    .status {
      font-family: monospace;
      color: #7dd3fc;
      letter-spacing: 3px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: monospace;
      letter-spacing: 4px;
      font-size: 30px;
      margin: 0 0 10px;
    }

    .source {
      font-family: monospace;
      color: #ff6b6b;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    .screen {
      background: black;
      border: 1px solid #294554;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 0 35px rgba(35, 148, 190, 0.18);
    }

    video {
      width: 100%;
      max-height: 70vh;
      display: block;
      border-radius: 8px;
      background: black;
    }

    .warning {
      margin-top: 20px;
      font-family: monospace;
      font-size: 13px;
      opacity: 0.65;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="status">
      SECURE CHANNEL ESTABLISHED
    </div>

    <h1>
      INCOMING TRANSMISSION
    </h1>

    <div class="source">
      SOURCE: UNKNOWN
    </div>

    <div class="screen">

      <video controls playsinline preload="metadata">
        <source src="./message1.mp4" type="video/mp4">

        הדפדפן שלך לא תומך בהפעלת הסרטון.
      </video>

    </div>

    <div class="warning">
      UNAUTHORIZED ACCESS DETECTED
    </div>

  </div>

</body>
</html>
