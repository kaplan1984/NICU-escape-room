<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locked</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #05080b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .lock {
      border: 2px solid #444;
      padding: 40px;
      width: 300px;
    }

    h1 {
      letter-spacing: 4px;
    }

    input {
      width: 180px;
      padding: 12px;
      font-size: 30px;
      text-align: center;
      letter-spacing: 10px;
      background: #111;
      color: white;
      border: 2px solid #666;
    }

    button {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 18px;
      background: #222;
      color: white;
      border: 1px solid #777;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="lock">

    <h1>LOCKED</h1>

    <p>ENTER 4-DIGIT CODE</p>

    <input
      id="code"
      type="text"
      maxlength="4"
      inputmode="numeric"
      autocomplete="off"
    >

    <br
