<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NICU Security Lock</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: #17232e;
      border: 1px solid #3c566b;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    .lock {
      font-size: 72px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 22px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      opacity: 0.75;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 18px;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      min-height: 60px;
      font-size: 18px;
      line-height: 1.5;
    }

    .success {
      font-size: 22px;
      font-weight: bold;
    }

    .code {
      font-size: 42px;
      letter-spacing: 6px;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="lock" id="lock">🔒</div>

    <h1>NICU SECURITY LOCK</h1>
    <div class="subtitle">Enter the access word</div>

    <input
      type="text"
      id="answer"
      placeholder="CODE WORD"
      autocomplete="off"
    >

    <button onclick="checkAnswer()">UNLOCK</button>

    <div id="message"></div>

  </div>

  <script>
    function checkAnswer() {

      const correctAnswer = "CAFFEINE";

      const userAnswer =
        document.getElementById("answer").value
        .trim()
        .toUpperCase();

      const message =
        document.getElementById("message");

      const lock =
        document.getElementById("lock");

      if (userAnswer === correctAnswer) {

        lock.textContent = "🔓";

        message.innerHTML =
          '<div class="success">ACCESS GRANTED</div>' +
          '<div>Physical lock code:</div>' +
          '<div class="code">2741</div>';

      } else {

        lock.textContent = "🔒";

        message.innerHTML =
          '<div style="font-weight:bold;">ACCESS DENIED</div>' +
          '<div>Incorrect code word</div>';

      }

    }
  </script>

</body>
</html>
